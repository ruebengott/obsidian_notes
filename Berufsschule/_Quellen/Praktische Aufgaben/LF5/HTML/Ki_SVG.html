<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>SVG Haus mit Auto</title>
  <style>
    body {
      background-color: #f0f0f0;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
  </style>
</head>
<body>
  <svg width="350" height="300" viewBox="0 0 350 300">

    <!-- Boden -->
    <rect x="0" y="220" width="350" height="80" fill="#8bc34a" />

    <!-- Hauskörper -->
    <rect x="80" y="130" width="140" height="100" fill="#ffcc80" stroke="#795548" stroke-width="3" />

    <!-- Dach -->
    <polygon points="70,130 150,70 230,130" fill="#e57373" stroke="#b71c1c" stroke-width="3" />

    <!-- Tür -->
    <rect x="135" y="165" width="30" height="65" fill="#6d4c41" />
    <circle cx="160" cy="198" r="3" fill="#f5f5f5" />

    <!-- Fenster links -->
    <rect x="95" y="145" width="30" height="25" fill="#bbdefb" stroke="#1e88e5" stroke-width="2" />
    <line x1="110" y1="145" x2="110" y2="170" stroke="#1e88e5" stroke-width="2" />
    <line x1="95" y1="157.5" x2="125" y2="157.5" stroke="#1e88e5" stroke-width="2" />

    <!-- Fenster rechts -->
    <rect x="175" y="145" width="30" height="25" fill="#bbdefb" stroke="#1e88e5" stroke-width="2" />
    <line x1="190" y1="145" x2="190" y2="170" stroke="#1e88e5" stroke-width="2" />
    <line x1="175" y1="157.5" x2="205" y2="157.5" stroke="#1e88e5" stroke-width="2" />

    <!-- Schornstein -->
    <rect x="190" y="85" width="20" height="35" fill="#795548" />

    <!-- Auto -->
    <!-- Karosserie -->
    <rect x="20" y="185" width="90" height="30" fill="#64b5f6" stroke="#1e88e5" stroke-width="2" />
    <!-- Dach -->
    <polygon points="40,185 70,165 110,165 120,185" fill="#64b5f6" stroke="#1e88e5" stroke-width="2" />
    <!-- Fenster -->
    <rect x="72" y="170" width="30" height="15" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5" />
    <!-- Räder -->
    <circle cx="45" cy="215" r="12" fill="#424242" />
    <circle cx="95" cy="215" r="12" fill="#424242" />
    <circle cx="45" cy="215" r="5" fill="#bdbdbd" />
    <circle cx="95" cy="215" r="5" fill="#bdbdbd" />

  </svg>
</body>
</html>
